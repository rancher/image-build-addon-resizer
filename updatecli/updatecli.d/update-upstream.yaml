---
name: "Update upstream version"

sources:
 upstream:
   name: Get upstream version
   kind: githubrelease
   spec:
     owner: kubernetes
     repository: autoscaler
     token: '{{ requiredEnv .github.token }}'
     typefilter:
       release: true
       draft: false
       prerelease: false
     versionfilter:
       kind: regex
       pattern: "addon-resizer-1.(\\d*).(\\d*)$"
   transformers:
      - trimprefix: "addon-resizer-"

targets:
  tagfile:
    name: 'Bump TAG to upstream version {{ source "upstream" }}'
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: TAG
      matchpattern: '(?m)^(.+)$'
      replacepattern: '{{ source "upstream" }}'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'

actions:
    default:
        title: 'Bump to upstream version {{ source "upstream" }}'
        kind: github/pullrequest
        spec:
            automerge: false
            labels:
                - chore
                - skip-changelog
                - status/auto-created
        scmid: default
